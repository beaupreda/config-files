background {
    monitor =
    path = /home/beaupreda/config-files/wallpapers/mage_tower.png
    blur_passes = 2
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 512, 64
    outline_thickness = 4
    dots_size = 0.32
    dots_spacing = 0.15
    dots_center = false
    dots_rounding = -1
    dots_fade_time = 200
    dots_text_format = 
    outer_color = rgb(200, 192, 147)
    inner_color = rgb(24, 22, 22)
    font_color = rgb(200, 192, 147)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1
    check_color = rgb(138, 154, 123)
    fail_color = rgb(196, 116, 110)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = The sea does not dream of you
    text_align = center
    color = rgba(200, 192, 147, 1.0)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    rotate = 0

    position = 0, 80
    halign = center
    valign = center
}
